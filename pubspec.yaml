name: food_delivery_app
description: A modern food delivery app with email authentication.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase (latest compatible versions)
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1

  # UI & animations
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  provider: ^6.1.1

  # Utilities
  intl: ^0.18.1
  email_validator: ^3.0.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true